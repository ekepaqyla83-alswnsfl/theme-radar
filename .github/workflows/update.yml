name: 테마 레이더 자동 갱신

on:
  schedule:
    - cron: '*/30 0-7 * * 1-5'
    - cron: '0 23 * * 0-4'
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install openpyxl
        run: pip install --quiet openpyxl

      - name: restore data
        uses: actions/cache@v4
        with:
          path: data
          key: theme-radar-data-${{ github.run_id }}
          restore-keys: theme-radar-data-

      - name: collect news
        continue-on-error: true
        run: python collector.py --source rss --hours 24 --xlsx --no-inject

      - name: collect quotes
        continue-on-error: true
        run: python quotes.py --source auto --quiet --no-inject

      - name: send alerts
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$TELEGRAM_TOKEN$SLACK_WEBHOOK" ]; then
            python notify.py --since 2
          else
            echo "no alert secrets, skipping"
          fi

      - name: build site
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
