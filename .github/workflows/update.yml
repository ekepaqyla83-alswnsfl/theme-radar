name: 테마분류

on:
  schedule:
    # ⚠️ Cron 시간은 UTC 기준입니다 (한국시간 = UTC + 9시간)
    - cron: '7,37 0-7 * * 1-5'    # KST 기준: 평일 09:07 ~ 16:37 (30분 간격)
    - cron: '7 23 * * 0-4'         # KST 기준: 월~금 08:07
    - cron: '17 13-21 * * 1-5'     # KST 기준: 평일 22:17 ~ 다음날 06:17
  workflow_dispatch:               # 수동 실행 버튼 활성화

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: Install openpyxl
        run: pip install --quiet openpyxl

      - name: Restore Data Cache
        uses: actions/cache@v4.2.0
        with:
          path: data
          key: theme-radar-data-${{ github.run_id }}
          restore-keys: theme-radar-data-

      - name: Fetch News
        continue-on-error: true
        run: python collector.py --source rss --hours 24 --xlsx --no-inject

      - name: Fetch Quotes
        continue-on-error: true
        run: python quotes.py --source auto --quiet --no-inject

      - name: Send Notification
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$TELEGRAM_TOKEN$SLACK_WEBHOOK" ]; then
            python notify.py --since 2
          else
            echo "Warning: Secrets missing, skipping notification."
          fi

      - name: Build Site
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
