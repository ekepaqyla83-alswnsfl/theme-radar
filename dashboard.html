<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테마 레이더 · 주식 테마 분류 & 뉴스속보</title>
<style>
:root{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --seq-100:#184f95; --seq-400:#3987e5; --seq-700:#0d366b;
  --pos:#0ca30c; --neg:#d03b3b;
  --radius:14px;
  --font:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html[data-theme="light"]{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --seq-100:#cde2fb; --seq-400:#2a78d6; --seq-700:#0d366b;
  --pos:#006300; --neg:#d03b3b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 64px}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
h1 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--crit);
  margin-right:8px;vertical-align:middle;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.hbtns{display:flex;gap:8px;align-items:center}
/* '지금 갱신' 버튼. 데이터가 오래되면 눈에 띄게 만든다. */
.btn.go{text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600}
.btn.go:hover{filter:brightness(1.12)}
.btn.go.warn{background:var(--warn);border-color:var(--warn);color:#1a1a19}
.btn.go.busy{background:var(--surface-2);border-color:var(--border);color:var(--muted);
  pointer-events:none}
/* 데이터가 언제 것인지 — 오래되면 색으로 알린다 */
.age{font-weight:600}
.age.old{color:var(--warn)}
/* 갱신 알림 토스트 */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--border);
  border-radius:11px;padding:11px 18px;font-size:13.5px;box-shadow:0 8px 28px rgba(0,0,0,.38);
  opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
button,select,input{font-family:inherit;font-size:13px}
.btn{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);
  border-radius:9px;padding:7px 12px;cursor:pointer}
.btn:hover{color:var(--ink)}
.btn.on{background:var(--s1);border-color:var(--s1);color:#fff}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.tile .lab{color:var(--muted);font-size:12px;letter-spacing:.01em}
.tile .val{font-size:27px;font-weight:650;margin-top:3px;letter-spacing:-.02em}
.tile .val small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:4px}
.tile.txt .val{font-size:17px;line-height:1.35;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding-top:7px}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:var(--ink-2);padding:6px 13px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.search{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:9px 12px;color:var(--ink)}
.search::placeholder{color:var(--muted)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.panel>h2{font-size:14px;margin:0;padding:14px 16px 10px;letter-spacing:-.01em;
  display:flex;justify-content:space-between;align-items:baseline}
.panel>h2 span{color:var(--muted);font-size:12px;font-weight:400}

/* ---------- theme bars ---------- */
.themes{max-height:660px;overflow-y:auto;padding:0 8px 8px}
.trow{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;
  padding:9px 8px;border-radius:10px;cursor:pointer;position:relative}
.trow:hover{background:var(--surface-2)}
.trow[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--s1)}
.trow .tname{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px}
.tname b{font-weight:550;font-size:13.5px}
.tname .heat{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px}
.bar{height:9px;border-radius:0 4px 4px 0;background:var(--seq-400);min-width:3px}
.bartrack{background:var(--grid);border-radius:0 4px 4px 0;height:9px}
.tmeta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--muted)}
.flag{font-size:10px;font-weight:650;padding:1px 5px;border-radius:4px;border:1px solid var(--border);color:var(--ink-2)}
.flag.kr{color:var(--s1);border-color:color-mix(in srgb,var(--s1) 45%,transparent)}
.flag.us{color:var(--s4);border-color:color-mix(in srgb,var(--s4) 45%,transparent)}
.senti{font-variant-numeric:tabular-nums}
.senti.p{color:var(--pos)} .senti.n{color:var(--neg)}

/* ---------- news feed ---------- */
.feed{max-height:660px;overflow-y:auto}
.item{padding:13px 16px;border-top:1px solid var(--grid)}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.itop{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:11.5px;color:var(--muted)}
.badge{font-size:10.5px;font-weight:650;padding:2px 6px;border-radius:5px;letter-spacing:.02em}
.badge.b3{background:var(--crit);color:#fff}
.badge.b2{background:color-mix(in srgb,var(--serious) 22%,transparent);color:var(--serious);
  border:1px solid color-mix(in srgb,var(--serious) 45%,transparent)}
.badge.b1{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.item h3{font-size:14.5px;margin:0 0 5px;font-weight:550;line-height:1.42;letter-spacing:-.01em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.isum{font-size:12.5px;color:var(--ink-2);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:11px;padding:2.5px 8px;border-radius:20px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--ink-2);cursor:pointer}
.tag.primary{border-color:color-mix(in srgb,var(--s1) 55%,transparent);color:var(--s1)}
.tag.stock{border-style:dashed;cursor:default}
.mark{font-size:11px;color:var(--muted)}
.empty{padding:44px 16px;text-align:center;color:var(--muted);font-size:13.5px}

/* ---------- detail ---------- */
.detail{padding:12px 16px 16px;border-top:1px solid var(--grid);background:var(--surface-2)}
.detail p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
.stocks{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:7px;border:1px solid var(--border);background:var(--surface)}
.chip.leader{border-color:color-mix(in srgb,var(--s1) 60%,transparent);color:var(--s1);font-weight:600}
.chip.core{border-color:color-mix(in srgb,var(--s3) 55%,transparent);color:var(--s3)}
.chip small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}

/* ---------- table view ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--muted);font-weight:550;position:sticky;top:0;background:var(--surface)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{max-height:660px;overflow:auto}
.hide{display:none}
footer{margin-top:22px;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.7}

/* ---------- 시세 티커 ---------- */
:root{ --up:#e01f1f; --down:#1f6fe0; --flat:#898781; }   /* 한국식: 상승 빨강 / 하락 파랑 */
html[data-theme="dark"]{ --up:#ff5a5a; --down:#5a9bff; }
.tickerbar{position:sticky;top:0;z-index:30;display:flex;align-items:stretch;gap:0;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;margin-bottom:14px;backdrop-filter:blur(6px)}
.sess{display:flex;align-items:center;gap:7px;padding:0 14px;white-space:nowrap;
  font-size:12px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--border);
  background:var(--surface-2)}
.sess .sdot{width:7px;height:7px;border-radius:50%;background:var(--flat)}
.sess[data-code="regular"] .sdot,.sess[data-code="night"] .sdot{background:var(--good);
  animation:pulse 2s infinite}
.sess[data-code="pre"] .sdot{background:var(--warn)}
.sess small{color:var(--muted);font-weight:400}
.marquee{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.track{display:flex;width:max-content;animation:roll 46s linear infinite}
.track.static{animation:none;width:100%}
.marquee:hover .track{animation-play-state:paused}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.q{display:flex;align-items:baseline;gap:7px;padding:11px 16px;white-space:nowrap;
  border-right:1px solid var(--grid);font-size:13px}
.q b{font-weight:500;color:var(--ink-2);font-size:12.5px}
.q .v{font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.q .c{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

/* ---------- 시세 수집 실패 표시 ---------- */
/* 값이 없으면 비워 둔다. 흐릿하게 두되 이름은 남겨서 '무엇이 빠졌는지'가 보이게. */
.q.na b,.q.na .v,.q.na .c{color:var(--muted)}
.q.na .v{font-weight:400}
.qwarn{color:var(--warn);font-weight:600;cursor:help}

/* ---------- 발송된 알림 ---------- */
.alertbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 16px 6px;margin-bottom:16px}
.alertbar .ah{display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;font-weight:600;margin-bottom:8px}
.alertbar .ah span{font-size:11.5px;font-weight:400;color:var(--muted)}
.alist{display:flex;flex-direction:column}
.arow{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px;
  border-top:1px solid var(--grid)}
.arow:first-child{border-top:0}
.arow .atheme{color:var(--muted);font-size:12px;white-space:nowrap;
  max-width:170px;overflow:hidden;text-overflow:ellipsis}
.arow .atitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .atime{color:var(--muted);font-size:11.5px;white-space:nowrap}
@media(max-width:640px){.arow .atheme{display:none}}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--axis);border-radius:9px}
</style>
</head>
<body>
<div class="wrap">

  <div class="tickerbar" id="tickerbar">
    <div class="sess" id="sess"><span class="sdot"></span><span id="sesslabel">시세 대기</span></div>
    <div class="marquee"><div class="track" id="track"></div></div>
  </div>

  <header>
    <div>
      <h1><span class="dot"></span>테마 레이더</h1>
      <div class="sub" id="meta">데이터 로딩 중…</div>
    </div>
    <div class="hbtns">
      <a class="btn go" id="runBtn" style="display:none" target="_blank" rel="noopener">지금 갱신</a>
      <button class="btn" id="viewBtn">표로 보기</button>
      <button class="btn" id="themeBtn">라이트 모드</button>
    </div>
  </header>

  <div class="alertbar" id="alertbar" style="display:none"></div>

  <div class="tiles" id="tiles"></div>

  <div class="controls">
    <div class="seg" role="group" aria-label="시장 선택">
      <button data-mkt="ALL" aria-pressed="true">전체</button>
      <button data-mkt="KR" aria-pressed="false">국내</button>
      <button data-mkt="US" aria-pressed="false">미국</button>
    </div>
    <div class="seg" role="group" aria-label="긴급도 필터">
      <button data-urg="0" aria-pressed="true">전체 뉴스</button>
      <button data-urg="3" aria-pressed="false">속보만</button>
      <button data-urg="2" aria-pressed="false">중요 이상</button>
    </div>
    <div class="seg" role="group" aria-label="분류 필터">
      <button id="unclsBtn" aria-pressed="false" title="어느 테마에도 안 걸린 기사 — 테마 신설 후보">미분류만</button>
    </div>
    <input class="search" id="q" type="search" placeholder="종목·키워드 검색 (예: HBM, 방산, NVDA)">
    <button class="btn" id="clearBtn">필터 초기화</button>
  </div>

  <div class="cols" id="chartView">
    <section class="panel">
      <h2>테마 열기 순위 <span id="themeCount"></span></h2>
      <div class="themes" id="themeList"></div>
    </section>

    <section class="panel">
      <h2 id="feedTitle">뉴스 속보 <span id="newsCount"></span></h2>
      <div class="feed" id="feed"></div>
    </section>
  </div>

  <div class="panel hide" id="tableView">
    <h2>전체 뉴스 표 <span>접근성·복사용</span></h2>
    <div class="tablewrap"><table id="tbl"></table></div>
  </div>

  <footer>
    테마 분류는 키워드 가중 스코어링 기반 자동 분류 결과이며, 투자 판단의 근거가 아닙니다.<br>
    뉴스 <code>python3 collector.py --source rss --xlsx --notify</code> ·
    시세 <code>python3 quotes.py --source auto --watch 30</code> ·
    시세가 비면 <code>python3 quotes.py --diag</code>
  </footer>
</div>

const state = { data:null, market:"ALL", urgency:0, q:"", theme:null, table:false,
                unclassified:false, alerts:null };
const $ = s => document.querySelector(s);

/* ---------- 부팅: data/news_data.json 우선, 실패 시 내장 데이터 ---------- */
(async function boot(){
  let d = null;
  try{
    const r = await fetch("data/news_data.json", {cache:"no-store"});
    if(r.ok) d = await r.json();
  }catch(e){ /* file:// 로 열었을 때는 내장 데이터 사용 */ }
  state.data = d || EMBEDDED_DATA;

  // 웹(GitHub Pages)에서 열었을 때만 갱신 버튼을 띄운다. 주소에서 계정·저장소 이름을
  // 읽어 만들기 때문에 이 파일을 다른 저장소에 그대로 써도 알아서 맞춰진다.
  const url = actionsUrl();
  if(url){
    const btn = $("#runBtn");
    btn.href = url;
    btn.dataset.ready = "1";
    btn.style.display = "inline-flex";
    btn.title = "GitHub 실행 화면이 새 탭으로 열립니다. Run workflow 를 누르면 3분쯤 뒤 이 화면이 알아서 바뀝니다.";
    btn.onclick = () => watchForUpdate();
  }

  if(!state.data){ $("#meta").textContent = "데이터 없음 — collector.py 를 먼저 실행하세요."; return; }
  render();
})();

/* ---------- 유틸 ---------- */
const fmtAgo = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if(m < 1) return "방금";
  if(m < 60) return m + "분 전";
  if(m < 1440) return Math.floor(m/60) + "시간 전";
  return Math.floor(m/1440) + "일 전";
};
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const URG = {3:["속보","b3"], 2:["중요","b2"], 1:["일반","b1"]};
const SENTI = {positive:["호재","p"], negative:["악재","n"], neutral:["중립",""]};

/* 열기는 막대 길이로 크기를 인코딩한다 — 색은 단일 시퀀셜 훅(파랑) 하나만 사용 */
const HEAT_COLOR = "var(--seq-400)";

/* ---------- 필터 ---------- */
function filteredNews(){
  const q = state.q.trim().toLowerCase();
  return state.data.news.filter(n => {
    if(state.market !== "ALL" && n.market !== state.market) return false;
    if(state.urgency && n.urgency < state.urgency) return false;
    if(state.unclassified && n.themes.length) return false;
    if(state.theme && !n.themes.some(t => t.theme_id === state.theme)) return false;
    if(q){
      const hay = (n.title + " " + n.summary + " " + n.primary_theme_name + " " +
        n.themes.map(t=>t.matched.join(" ")).join(" ") + " " +
        (n.related_stocks||[]).map(s=>s.name+" "+s.code).join(" ")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function filteredThemes(){
  return state.data.themes.filter(t =>
    (state.market === "ALL" || t.market === state.market) && t.news_count > 0);
}

/* ---------- 렌더 ---------- */
function render(){ renderMeta(); renderTiles(); renderThemes(); renderFeed(); renderTable(); renderAlerts(); }

function renderMeta(){
  const d = state.data;
  const at = new Date(d.generated_at);
  const hrs = (Date.now() - at) / 3600000;
  const stamp =
    `${at.getFullYear()}.${String(at.getMonth()+1).padStart(2,"0")}.${String(at.getDate()).padStart(2,"0")} ` +
    `${String(at.getHours()).padStart(2,"0")}:${String(at.getMinutes()).padStart(2,"0")}`;
  // 언제 것인지를 숫자로만 보여주면 오래된 걸 눈치채기 어렵다. '몇 시간 전'을 같이 적고
  // 2시간이 넘으면 색으로 알린다 — 지금은 사람이 직접 갱신을 눌러야 하는 구조라서.
  $("#meta").innerHTML =
    `${stamp} 기준 <span class="age${hrs >= 2 ? " old" : ""}">(${fmtAgo(d.generated_at)})</span>` +
    ` · 최근 ${d.window_hours}시간 · 소스 ${esc(d.source)}`;

  const btn = $("#runBtn");
  if(btn && btn.dataset.ready === "1"){
    btn.classList.toggle("warn", hrs >= 2);
    if(!btn.classList.contains("busy"))
      btn.textContent = hrs >= 2 ? "지금 갱신 (오래됨)" : "지금 갱신";
  }
}

/* ---------- 수동 갱신 ----------
   버튼이 GitHub 를 직접 실행시키지는 못한다. 그러려면 실행 권한이 있는 토큰을 이 페이지에
   심어야 하는데, 공개 저장소에서는 그 토큰이 그대로 노출된다. 그래서 실행 화면을 열어주는
   데까지만 하고, 대신 갱신이 끝났는지는 이 페이지가 대신 지켜본다 — F5 를 안 눌러도 되게. */
function actionsUrl(){
  const host = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split("/").filter(Boolean)[0];
  if(!host || !repo) return null;      // 로컬에서 연 경우엔 버튼을 숨긴다
  return `https://github.com/${host[1]}/${repo}/actions/workflows/update.yml`;
}

function toast(msg, ms = 4000){
  let el = $("#toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast"; el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(() => el.classList.add("on"));
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), ms);
}

/* 갱신을 누른 뒤 최대 12분간 30초마다 확인한다. 새 데이터가 오면 화면을 바로 바꾼다. */
let watchTimer = null;
function watchForUpdate(){
  const before = state.data && state.data.generated_at;
  const until = Date.now() + 12 * 60 * 1000;
  const btn = $("#runBtn");
  if(btn){ btn.classList.add("busy"); btn.textContent = "갱신 확인 중…"; }

  clearInterval(watchTimer);
  watchTimer = setInterval(async () => {
    let d = null;
    try{
      const r = await fetch("data/news_data.json?t=" + Date.now(), {cache:"no-store"});
      if(r.ok) d = await r.json();
    }catch(e){ /* 잠깐 실패해도 다음 주기에 다시 본다 */ }

    if(d && d.generated_at !== before){
      clearInterval(watchTimer);
      state.data = d;
      if(btn){ btn.classList.remove("busy"); btn.dataset.ready = "1"; }
      render();
      toast(`갱신됐습니다 — 뉴스 ${d.news.length}건`, 6000);
      return;
    }
    if(Date.now() > until){
      clearInterval(watchTimer);
      if(btn){ btn.classList.remove("busy"); btn.dataset.ready = "1"; }
      renderMeta();
      toast("아직 새 데이터가 안 보입니다. 실행이 끝났는지 확인해 주세요.", 7000);
    }
  }, 30000);
}

function renderTiles(){
  const news = filteredNews(), themes = filteredThemes();
  const breaking = news.filter(n => n.urgency >= 3).length;
  const pos = news.filter(n => n.sentiment === "positive").length;
  const neg = news.filter(n => n.sentiment === "negative").length;
  const top = themes[0];
  // 미분류는 '못 잡은 기사'가 아니라 '테마를 새로 만들 후보'다 — 전체 대비 비율로 본다
  const all = state.data.news.filter(n => state.market === "ALL" || n.market === state.market);
  const uncls = all.filter(n => !n.themes.length).length;
  const rate = all.length ? Math.round((all.length - uncls) / all.length * 100) : 0;
  const tiles = [
    ["수집 뉴스", news.length, "건"],
    ["속보", breaking, "건"],
    ["활성 테마", themes.length, "개"],
    ["분류율", rate, "%"],
    ["미분류", uncls, "건"],
    ["호재 / 악재", `${pos} / ${neg}`, ""],
    ["최고 열기 테마", top ? top.name : "—", "", true],
  ];
  $("#tiles").innerHTML = tiles.map(([l,v,u,txt]) =>
    `<div class="tile${txt?" txt":""}" ${txt?`title="${esc(String(v))}"`:""}><div class="lab">${l}</div>` +
    `<div class="val">${esc(String(v))}${u?`<small>${u}</small>`:""}</div></div>`
  ).join("");
}

function renderThemes(){
  const themes = filteredThemes();
  const max = Math.max(1, ...themes.map(t => t.heat));
  $("#themeCount").textContent = `${themes.length}개 · 클릭하면 해당 테마 뉴스만`;
  $("#themeList").innerHTML = themes.map(t => {
    const w = Math.max(3, Math.round(t.heat / max * 100));
    const on = state.theme === t.id;
    const s = t.sentiment_score;
    const leaders = t.stocks.filter(x=>x.role!=="related");
    return `
    <button class="trow" data-theme="${t.id}" aria-pressed="${on}" title="${esc(t.summary)}">
      <div class="tname"><b>${esc(t.name)}</b><span class="heat">${t.heat}</span></div>
      <div class="bartrack" style="width:100%"><div class="bar" style="width:${w}%;background:${HEAT_COLOR}"></div></div>
      <div class="tmeta">
        <span class="flag ${t.market.toLowerCase()}">${t.market}</span>
        <span>뉴스 ${t.news_count}</span>
        ${t.breaking_count ? `<span style="color:var(--crit)">● 속보 ${t.breaking_count}</span>` : ""}
        <span class="senti ${s>0?"p":s<0?"n":""}">심리 ${s>0?"+":""}${s}</span>
        <span>· ${fmtAgo(t.last_news)}</span>
      </div>
      ${on ? `<div class="detail" style="margin-top:10px;border-radius:9px;border-top:0">
        <p>${esc(t.summary)}</p>
        <div class="stocks">${leaders.concat(t.stocks.filter(x=>x.role==="related")).map(x =>
          `<span class="chip ${x.role}">${esc(x.name)}<small>${esc(x.code)}</small></span>`).join("")}</div>
      </div>` : ""}
    </button>`;
  }).join("") || `<div class="empty">해당 조건의 테마가 없습니다.</div>`;

  $("#themeList").querySelectorAll(".trow").forEach(el =>
    el.onclick = () => { state.theme = state.theme === el.dataset.theme ? null : el.dataset.theme; render(); });
}

function renderFeed(){
  const news = filteredNews();
  const tname = state.theme ? (state.data.themes.find(t=>t.id===state.theme)||{}).name : null;
  $("#feedTitle").firstChild.textContent = tname ? `${tname} 뉴스 ` : "뉴스 속보 ";
  $("#newsCount").textContent = `${news.length}건`;
  $("#feed").innerHTML = news.map(n => {
    const [ulab, ucls] = URG[n.urgency] || URG[1];
    const [slab, scls] = SENTI[n.sentiment];
    return `
    <article class="item">
      <div class="itop">
        <span class="badge ${ucls}">${ulab}</span>
        <span class="flag ${n.market.toLowerCase()}">${n.market}</span>
        <span class="senti ${scls}">${slab}</span>
        <span>·</span><span>${esc(n.source)}</span>
        <span>·</span><span>${fmtAgo(n.published)}</span>
      </div>
      <h3><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></h3>
      ${n.summary ? `<p class="isum">${esc(n.summary)}</p>` : ""}
      <div class="tags">
        ${n.themes.map((t,i)=>`<span class="tag ${i===0?"primary":""}" data-t="${t.theme_id}">${esc(t.theme)} ${t.score}</span>`).join("")}
        ${(n.related_stocks||[]).slice(0,4).map(s=>`<span class="tag stock">${esc(s.name)}</span>`).join("")}
      </div>
      ${n.themes[0]&&n.themes[0].matched.length ? `<div class="mark" style="margin-top:6px">매칭: ${esc(n.themes[0].matched.join(", "))}</div>` : ""}
    </article>`;
  }).join("") || `<div class="empty">조건에 맞는 뉴스가 없습니다.<br>필터를 넓혀보세요.</div>`;

  $("#feed").querySelectorAll(".tag[data-t]").forEach(el =>
    el.onclick = () => { state.theme = el.dataset.t; render(); document.querySelector(".wrap").scrollIntoView({behavior:"smooth"}); });
}

function renderTable(){
  const news = filteredNews();
  $("#tbl").innerHTML =
    `<thead><tr><th>시각</th><th>시장</th><th>긴급도</th><th>심리</th><th>대표 테마</th><th>제목</th><th class="num">점수</th></tr></thead><tbody>` +
    news.map(n=>`<tr>
      <td>${new Date(n.published).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}</td>
      <td>${n.market}</td><td>${(URG[n.urgency]||URG[1])[0]}</td>
      <td>${SENTI[n.sentiment][0]}</td><td>${esc(n.primary_theme_name)}</td>
      <td><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></td>
      <td class="num">${n.themes[0]?n.themes[0].score:"-"}</td></tr>`).join("") + `</tbody>`;
}


/* ================= 발송된 속보 알림 ================= */
/* notify.py 가 텔레그램·슬랙·윈도우로 실제 밀어낸 기사 목록.
   "내가 알림을 받았던가?" 를 화면에서 바로 확인할 수 있게 남긴다. */
function renderAlerts(){
  const box = $("#alertbar");
  const a = (state.alerts && state.alerts.alerts) || [];
  if(!a.length){ box.style.display = "none"; return; }
  const recent = a.slice(0, 6);
  box.style.display = "block";
  box.innerHTML =
    `<div class="ah">발송된 속보 알림<span>최근 ${a.length}건 · ${fmtAgo(state.alerts.updated)} 갱신</span></div>` +
    `<div class="alist">` + recent.map(x => `
      <div class="arow">
        <span class="badge b3">발송</span>
        <span class="atheme">${esc(x.theme || "미분류")}</span>
        <span class="atitle">${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)}</span>
        <span class="atime">${fmtAgo(x.sent_at)}</span>
      </div>`).join("") + `</div>`;
}

async function loadAlerts(){
  try{
    const r = await fetch("data/alerts.json", {cache:"no-store"});
    if(r.ok) state.alerts = await r.json();
  }catch(e){ /* 알림을 안 쓰면 파일이 없다 — 정상 */ }
  renderAlerts();
}

/* ================= 시세 티커 ================= */
const QSTATE = { quotes: null };
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const arrow = v => v > 0 ? "▲" : v < 0 ? "▼" : "─";
const nfmt = (v, d) => v.toLocaleString("ko-KR", {minimumFractionDigits:d, maximumFractionDigits:d});

/* 수집에 실패한 항목은 ok:false 로 온다. 값을 지어내지 않고 '—' 로 비워 그린다.
   시세가 없는 것과 0인 것은 다르다 — 빈 자리가 그 사실을 정직하게 보여준다. */
const okq = i => i && i.ok !== false && i.last != null;

function renderTicker(){
  const q = QSTATE.quotes;
  if(!q){ return; }
  const se = $("#sess");
  se.dataset.code = q.session.code;
  const miss = (q.missing || []).length;
  $("#sesslabel").innerHTML = `${esc(q.session.label)} <small>${esc(q.session.hint)}</small>` +
    (miss ? ` <small class="qwarn" title="${esc((q.missing||[]).join(', '))}">시세 ${miss}건 수집 실패</small>` : "");

  const cell = i => okq(i)
    ? `<div class="q" title="${esc(i.via||i.src||"")}"><b>${esc(i.name)}</b>` +
      `<span class="v ${cls(i.change)}">${nfmt(i.last, i.dec)}${esc(i.unit||"")}</span>` +
      `<span class="c ${cls(i.change)}">${arrow(i.change)} ${nfmt(Math.abs(i.change), i.dec)} ` +
      `(${i.pct > 0 ? "+" : ""}${i.pct.toFixed(2)}%)</span></div>`
    : `<div class="q na"><b>${esc(i.name)}</b><span class="v">—</span>` +
      `<span class="c">수집 실패</span></div>`;
  // 티커에 고정한 종목이 없으면 전체를 흘린다
  const items = q.ticker.length ? q.ticker : q.groups.flatMap(g => g.items);
  const row = items.map(cell).join("");
  const tr = $("#track");
  // 고정 항목이 몇 개 안 되면 흐르게 두지 않고 그대로 세워둔다
  tr.classList.toggle("static", items.length <= 4);
  tr.innerHTML = items.length <= 4 ? row : row + row;
}

async function loadQuotes(){
  let q = null;
  try{
    const r = await fetch("data/quotes.json", {cache:"no-store"});
    if(r.ok) q = await r.json();
  }catch(e){ /* file:// 로 열면 내장 시세 사용 */ }
  QSTATE.quotes = q || EMBEDDED_QUOTES;
  renderTicker();
}
loadQuotes();
setInterval(loadQuotes, 30000);   // 30초 폴링 — quotes.py --watch 와 짝
loadAlerts();
setInterval(loadAlerts, 60000);

/* ---------- 이벤트 ---------- */
document.querySelectorAll("[data-mkt]").forEach(b => b.onclick = () => {
  state.market = b.dataset.mkt; state.theme = null;
  document.querySelectorAll("[data-mkt]").forEach(x => x.setAttribute("aria-pressed", x===b));
  render();
});
document.querySelectorAll("[data-urg]").forEach(b => b.onclick = () => {
  state.urgency = +b.dataset.urg;
  document.querySelectorAll("[data-urg]").forEach(x => x.setAttribute("aria-pressed", x===b));
  render();
});
$("#unclsBtn").onclick = () => {
  state.unclassified = !state.unclassified;
  if(state.unclassified) state.theme = null;      // 미분류만 볼 땐 테마 필터와 충돌한다
  $("#unclsBtn").setAttribute("aria-pressed", state.unclassified);
  render();
};
let t; $("#q").oninput = e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; render(); }, 180); };
$("#clearBtn").onclick = () => {
  state.market="ALL"; state.urgency=0; state.q=""; state.theme=null; state.unclassified=false; $("#q").value="";
  document.querySelectorAll("[data-mkt]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.mkt==="ALL"));
  document.querySelectorAll("[data-urg]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.urg==="0"));
  $("#unclsBtn").setAttribute("aria-pressed", false);
  render();
};
$("#viewBtn").onclick = () => {
  state.table = !state.table;
  $("#chartView").classList.toggle("hide", state.table);
  $("#tableView").classList.toggle("hide", !state.table);
  $("#viewBtn").textContent = state.table ? "카드로 보기" : "표로 보기";
};
$("#themeBtn").onclick = () => {
  const light = document.documentElement.dataset.theme === "light";
  document.documentElement.dataset.theme = light ? "dark" : "light";
  $("#themeBtn").textContent = light ? "라이트 모드" : "다크 모드";
};
</script>
